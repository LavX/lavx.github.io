<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LavX - Self-Hosted &amp; Open Source Projects</title>
  <meta name="description" content="Open-source self-hosting projects by LavX, including Bazarr+, a drop-in Bazarr replacement for Sonarr, Radarr, Plex, and Jellyfin subtitle management.">
  <link rel="canonical" href="https://lavx.github.io/">
  <meta name="theme-color" content="#1a1a2e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="LavX - Self-Hosted & Open Source Projects">
  <meta property="og:description" content="Open-source self-hosting projects by LavX, including Bazarr+ for Sonarr, Radarr, Plex, and Jellyfin subtitle management.">
  <meta property="og:url" content="https://lavx.github.io/">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #121125; color: #e8e8f0; line-height: 1.6;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    main { max-width: 620px; width: 100%; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.02em; }
    .accent { color: #f0a030; }
    p.lead { color: #b8b8cc; margin: 16px 0 32px; font-size: 1.1rem; }
    .card {
      display: block; padding: 22px 24px; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; background: #1a1a2e; text-decoration: none; color: inherit;
      transition: border-color .2s, transform .2s;
    }
    .card:hover { border-color: rgba(240,160,48,0.5); transform: translateY(-2px); }
    .card h2 { font-size: 1.25rem; margin-bottom: 6px; }
    .card span { color: #b0b1c8; font-size: 0.95rem; }
    footer { margin-top: 36px; color: #8a8aa0; font-size: 0.9rem; }
    footer a { color: #f0a030; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Lav<span class="accent">X</span></h1>
    <p class="lead">Open-source, self-hosted projects.</p>
    <a class="card" href="https://lavx.github.io/bazarr/">
      <h2>Bazarr+ <span class="accent">&rarr;</span></h2>
      <span>A drop-in Bazarr replacement for Sonarr, Radarr, Plex &amp; Jellyfin: Provider Hub plugin marketplace, AI translation, bulk operations, a subtitle editor, and zero telemetry.</span>
    </a>
    <footer>
      Built by <a href="https://github.com/LavX" rel="me">LavX</a> on GitHub.
    </footer>
  </main>
</body>
</html>
